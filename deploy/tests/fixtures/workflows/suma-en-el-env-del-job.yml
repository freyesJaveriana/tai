---
# Control negativo (B8): la línea fija usa ${SHA256}, que el env del JOB define con una suma cualquiera; el
# env del paso lleva la suma de la tabla con otro nombre (señuelo) y nada la usa.
name: suma-en-el-env-del-job
on:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SHA256: "eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"
    steps:
      - name: Instalar con la suma del job
        env:
          SUMA_TABLA: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/a.tar.gz" "https://example.org/trivy_0.76.2_Linux-64bit.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/a.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/a.tar.gz" -C "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
