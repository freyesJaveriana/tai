# Dependabot (tarea previa P0.1). Solo avisa: abre PR que pasan por la CI.
# Cada Bolt suma el ecosistema de su servicio (uv, npm, docker) al crearlo.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
