# Perfiles de ejecución del analizador (C18, CG-U11-12). Solo cambia por PR (BR2.11).
# Los dos perfiles son de demostración con Anthropic: el juez y el verificador son de la misma
# familia, y por eso declaran `same_family_declared` y llevan el aviso `same_family` (BR2.5).
# `demo-anthropic-opus` existe para la prueba de cambio de modelo (scripts/humano/cambio-modelo.sh):
# es el mismo perfil con otro modelo, sin tocar código.
# El archivo nombra la variable de la clave (`api_key_ref`), nunca su valor; los límites y la
# referencia del prompt no van aquí: viven en la configuración efectiva.
schema_version: "1.0.0"
profiles:
  demo-anthropic:
    purpose: demonstration
    same_family_declared: true
    permutation: true
    role_aliases:
      verifier_permuted: verifier
    roles:
      judge:
        provider: anthropic
        model: claude-sonnet-5-5
        scope: external
        family: claude
        api_key_ref: VERIDICUS_ANTHROPIC_API_KEY
      verifier:
        provider: anthropic
        model: claude-sonnet-5-5
        scope: external
        family: claude
        api_key_ref: VERIDICUS_ANTHROPIC_API_KEY
  demo-anthropic-opus:
    purpose: demonstration
    same_family_declared: true
    permutation: true
    role_aliases:
      verifier_permuted: verifier
    roles:
      judge:
        provider: anthropic
        model: claude-opus-5-5
        scope: external
        family: claude
        api_key_ref: VERIDICUS_ANTHROPIC_API_KEY
      verifier:
        provider: anthropic
        model: claude-opus-5-5
        scope: external
        family: claude
        api_key_ref: VERIDICUS_ANTHROPIC_API_KEY
