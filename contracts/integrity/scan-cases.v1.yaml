    synthetic: true
    rule: vocabulary
    field: hecho
    text: "Mintio sobre la fecha del viaje."
    literal_sources: []
    expect: {matches: [mintió], excluded: []}
  # E14 es una limitación declarada: la lista trae las flexiones de género y número (E-7) y las formas
  # verbales comunes de «mentir», «inculpar» y «engañar» (E-8, presente, pretérito e infinitivo), pero no
  # los gerundios («mintiendo») ni las subcadenas («falsete»). Las formas de «probar» («pruebe», «probó»,
  # «probar») quedan fuera de C8 por E-8: dan falsos positivos en los textos de la interfaz. Cada
  # ampliación entra por su PR con su control negativo.
  - id: e14-falsete-no-coincide
    source: E14
    synthetic: true
    rule: vocabulary
    field: hecho
    text: "Se oyó un falsete en la canción del patio."
    literal_sources: []
    expect: {matches: [], excluded: []}
  - id: e14-gerundio-no-coincide
