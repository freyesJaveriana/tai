# Ganchos locales (team.md: gitleaks, Ruff y yamllint). La CI repite todo, porque el gancho se puede saltar.
# Cada gancho va fijado a una versión. Ruff solo comprueba (K-61: ruff format queda por decidir).
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: [--config, .gitleaks.toml]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-s]
        # Mismo alcance que repo-level0: .github/ y este archivo (los YAML de contracts/ son K-71).
        files: ^(\.github/|\.pre-commit-config\.yaml$)
