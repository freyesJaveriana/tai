---
# Configuración de yamllint del repositorio (tarea previa P0.1).
extends: default

# K-71: no se analizan entornos ni artefactos generados (el directorio contracts/ contiene .venv/).
ignore: |
  .venv/
  contracts/build/
  node_modules/

rules:
  document-start: disable
  truthy:
    check-keys: false
  line-length:
    max: 120
  comments:
    min-spaces-from-content: 1
