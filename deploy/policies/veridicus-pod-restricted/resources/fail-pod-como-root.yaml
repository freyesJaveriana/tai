---
apiVersion: v1
kind: Pod
metadata:
  name: como-root
  namespace: veridicus-demo
spec:
  securityContext:
    runAsNonRoot: false
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: analyzer
      image: ghcr.io/o/a:v1
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
