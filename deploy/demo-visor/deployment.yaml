---
# El visor (scripts/humano/visor-demo.py) en un pod. La imagen la construye visor-pod.sh dentro de
# Minikube, por eso no se descarga (imagePullPolicy: Never) y su etiqueta es fija.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: veridicus-visor
  namespace: veridicus-visor
  labels:
    app.kubernetes.io/name: veridicus-visor
spec:
  replicas: 1
  # Un solo visor a la vez: el Job de la demo es uno solo.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: veridicus-visor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: veridicus-visor
    spec:
      serviceAccountName: veridicus-visor
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: visor
          image: veridicus-visor:demo
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8501
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
