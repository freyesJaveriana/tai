---
apiVersion: v1
kind: Pod
metadata:
  name: con-escalada
  namespace: veridicus-demo
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: analyzer
      image: ghcr.io/o/a:v1
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: true
        capabilities:
          drop:
            - ALL
