---
# Control negativo (N1): con set -e, una suma mala seguida de && no detiene el script: el tar siguiente
# corre con un binario sin verificar.
name: sha256sum-conjuncion
on:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Instalar con la verificación en una conjunción
        env:
          SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/a.tar.gz" "https://example.org/a.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/a.tar.gz" | sha256sum -c - && echo ok
          tar -xzf "$RUNNER_TEMP/a.tar.gz" -C "$RUNNER_TEMP"
