---
apiVersion: v1
kind: Pod
metadata:
  name: restringido
  namespace: veridicus-demo
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: analyzer
      image: ghcr.io/o/a:v1
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
