# Comprobaciones de nivel 0 de U11 (incoherence-analyzer, paso 13 del plan): un job por paquete y la
# compuerta de cobertura al final. Sin filtro de rutas, para que cada job pueda ser comprobación
# obligatoria de main sin quedar pendiente en un PR que no toca los paquetes.
# Los pasos con red (instalar y auditar) van separados de los que no la tienen, que usan
# --frozen --offline. La CI no despliega: sin credenciales del clúster (AUTONOMIA-01).
# Las pruebas `manual` (proveedor real) quedan fuera: las lanza el humano. Sin nivel 2 en B11a (CG-U11-05).
name: analyzer-level0

on:
  pull_request:
  push:
    branches: [main]
    # La etiqueta de la entrega: solo se comprueba; la pone el humano y la CI no publica nada.
    tags: ["analyzer-v*"]

permissions:
  contents: read

concurrency:
  group: analyzer-level0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  incoherence-analyzer:
    name: analyzer-level0 (incoherence_analyzer)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.9"
          enable-cache: false

      - name: Instalar libs/incoherence_analyzer con el lockfile y sus hashes (red)
        run: uv sync --frozen --extra cli --directory libs/incoherence_analyzer

      - name: El lockfile está al día
        run: uv lock --check --directory libs/incoherence_analyzer

      - name: Lint de Python
        run: uv run --frozen --offline --directory libs/incoherence_analyzer ruff check .

      - name: Formato de Python
        run: uv run --frozen --offline --directory libs/incoherence_analyzer ruff format --check .

      - name: Tipos de Python
        run: uv run --frozen --offline --directory libs/incoherence_analyzer mypy --strict src tests

      - name: Fronteras entre capas
        run: uv run --frozen --offline --directory libs/incoherence_analyzer lint-imports

      - name: Crear libs/incoherence_analyzer/build/ para la salida de pip-audit
        run: mkdir -p libs/incoherence_analyzer/build

      - name: Auditar Python (red)
        run: >-
          uv run --frozen --directory libs/incoherence_analyzer
          pip-audit --format json --output build/pip-audit.json

      - name: Compuerta de auditoría (toda vulnerabilidad con versión corregida)
        run: >-
          uv run --frozen --offline --directory libs/incoherence_analyzer
          python -m veridicus_contracts.tools.audit_gate build/pip-audit.json
          --ignore ../../contracts/.pip-audit-ignore.yaml

      - name: Suite (sin red, cobertura de líneas >= 80 %)
        run: >-
          timeout 300 uv run --frozen --offline --directory libs/incoherence_analyzer
          pytest --cov=veridicus_incoherence_analyzer --cov-branch --cov-report=json --cov-fail-under=80

  model-gateway:
    name: analyzer-level0 (model_gateway)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.9"
          enable-cache: false

      - name: Instalar libs/model_gateway con el lockfile y sus hashes (red)
        run: uv sync --frozen --directory libs/model_gateway

      - name: El lockfile está al día
        run: uv lock --check --directory libs/model_gateway

      - name: Lint de Python
        run: uv run --frozen --offline --directory libs/model_gateway ruff check .

      - name: Formato de Python
        run: uv run --frozen --offline --directory libs/model_gateway ruff format --check .

      - name: Tipos de Python
        run: uv run --frozen --offline --directory libs/model_gateway mypy --strict src tests

      - name: Fronteras entre capas
        run: uv run --frozen --offline --directory libs/model_gateway lint-imports

      - name: Crear libs/model_gateway/build/ para la salida de pip-audit
        run: mkdir -p libs/model_gateway/build

      - name: Auditar Python (red)
        run: >-
          uv run --frozen --directory libs/model_gateway
          pip-audit --format json --output build/pip-audit.json

      - name: Compuerta de auditoría (toda vulnerabilidad con versión corregida)
        run: >-
          uv run --frozen --offline --directory libs/model_gateway
          python -m veridicus_contracts.tools.audit_gate build/pip-audit.json
          --ignore ../../contracts/.pip-audit-ignore.yaml

      - name: Suite (sin red, cobertura de líneas >= 80 %)
        run: >-
          timeout 300 uv run --frozen --offline --directory libs/model_gateway
          pytest --cov=veridicus_model_gateway --cov-branch --cov-report=json --cov-fail-under=80

  execution-profiles:
    name: analyzer-level0 (execution_profiles)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.9"
          enable-cache: false

      - name: Instalar libs/execution_profiles con el lockfile y sus hashes (red)
        run: uv sync --frozen --directory libs/execution_profiles

      - name: El lockfile está al día
        run: uv lock --check --directory libs/execution_profiles

      - name: Lint de Python
        run: uv run --frozen --offline --directory libs/execution_profiles ruff check .

      - name: Formato de Python
        run: uv run --frozen --offline --directory libs/execution_profiles ruff format --check .

      - name: Tipos de Python
        run: uv run --frozen --offline --directory libs/execution_profiles mypy --strict src tests

      - name: Fronteras entre capas
        run: uv run --frozen --offline --directory libs/execution_profiles lint-imports

      - name: Crear libs/execution_profiles/build/ para la salida de pip-audit
        run: mkdir -p libs/execution_profiles/build

      - name: Auditar Python (red)
        run: >-
          uv run --frozen --directory libs/execution_profiles
          pip-audit --format json --output build/pip-audit.json

      - name: Compuerta de auditoría (toda vulnerabilidad con versión corregida)
        run: >-
          uv run --frozen --offline --directory libs/execution_profiles
          python -m veridicus_contracts.tools.audit_gate build/pip-audit.json
          --ignore ../../contracts/.pip-audit-ignore.yaml

      - name: Suite (sin red, cobertura de líneas >= 80 %)
        run: >-
          timeout 300 uv run --frozen --offline --directory libs/execution_profiles
          pytest --cov=veridicus_execution_profiles --cov-branch --cov-report=json --cov-fail-under=80

  integrity-policy:
    name: analyzer-level0 (integrity_policy)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.9"
          enable-cache: false

      - name: Instalar libs/integrity_policy con el lockfile y sus hashes (red)
        run: uv sync --frozen --directory libs/integrity_policy

      - name: El lockfile está al día
        run: uv lock --check --directory libs/integrity_policy

      - name: Lint de Python
        run: uv run --frozen --offline --directory libs/integrity_policy ruff check .

      - name: Formato de Python
        run: uv run --frozen --offline --directory libs/integrity_policy ruff format --check .

      - name: Tipos de Python
        run: uv run --frozen --offline --directory libs/integrity_policy mypy --strict src tests

      - name: Fronteras entre capas
        run: uv run --frozen --offline --directory libs/integrity_policy lint-imports

      - name: Crear libs/integrity_policy/build/ para la salida de pip-audit
        run: mkdir -p libs/integrity_policy/build

      - name: Auditar Python (red)
        run: >-
          uv run --frozen --directory libs/integrity_policy
          pip-audit --format json --output build/pip-audit.json

      - name: Compuerta de auditoría (toda vulnerabilidad con versión corregida)
        run: >-
          uv run --frozen --offline --directory libs/integrity_policy
          python -m veridicus_contracts.tools.audit_gate build/pip-audit.json
          --ignore ../../contracts/.pip-audit-ignore.yaml

      - name: Suite (sin red, cobertura de líneas >= 80 %)
        run: >-
          timeout 300 uv run --frozen --offline --directory libs/integrity_policy
          pytest --cov=veridicus_integrity_policy --cov-branch --cov-report=json --cov-fail-under=80

  # La compuerta lee los cuatro coverage.json. Sin actions/upload-artifact (su SHA no está aprobado
  # aún en este repositorio), un job no puede pasarle archivos a otro: este job vuelve a correr las
  # cuatro suites para producir los informes y los junta. Cuesta unos minutos y evita una acción nueva.
  coverage-gate:
    name: analyzer-level0 (coverage_gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.9"
          enable-cache: false

      - name: Instalar los cuatro paquetes con el lockfile y sus hashes (red)
        run: |
          uv sync --frozen --extra cli --directory libs/incoherence_analyzer
          uv sync --frozen --directory libs/model_gateway
          uv sync --frozen --directory libs/execution_profiles
          uv sync --frozen --directory libs/integrity_policy

      - name: Informe de cobertura de incoherence_analyzer
        run: >-
          timeout 300 uv run --frozen --offline --directory libs/incoherence_analyzer
          pytest --cov=veridicus_incoherence_analyzer --cov-branch --cov-report=json --cov-fail-under=80

      - name: Informe de cobertura de model_gateway
        run: >-
          timeout 300 uv run --frozen --offline --directory libs/model_gateway
          pytest --cov=veridicus_model_gateway --cov-branch --cov-report=json --cov-fail-under=80

      - name: Informe de cobertura de execution_profiles
        run: >-
          timeout 300 uv run --frozen --offline --directory libs/execution_profiles
          pytest --cov=veridicus_execution_profiles --cov-branch --cov-report=json --cov-fail-under=80

      - name: Informe de cobertura de integrity_policy
        run: >-
          timeout 300 uv run --frozen --offline --directory libs/integrity_policy
          pytest --cov=veridicus_integrity_policy --cov-branch --cov-report=json --cov-fail-under=80

      - name: Ramas de los módulos guardia al 100 % y líneas al 80 % por paquete
        run: >-
          timeout 60 uv run --frozen --offline --directory libs/incoherence_analyzer
          python -m veridicus_incoherence_analyzer.testing.coverage_gate
          ../incoherence_analyzer/coverage.json ../model_gateway/coverage.json
          ../execution_profiles/coverage.json ../integrity_policy/coverage.json
