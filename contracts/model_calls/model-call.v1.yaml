$schema: https://json-schema.org/draft/2020-12/schema
$id: veridicus/contracts/model_calls/model-call.v1
title: Registro de una llamada a un modelo (C13)
description: >-
  Misma forma que `ModelCall` de `veridicus_contracts.model_calls`. El papel es una cadena con
  patrón y no una lista cerrada (BR9.1, FD-U1-01): el analizador lo restringe a `judge`,
  `verifier` y `verifier_permuted` en C18 y en C19. Estricto y sin texto libre: toda cadena
  tiene patrón sin espacios o formato cerrado y todo entero, tope (NFR1.4).
type: object
additionalProperties: false
required:
  - role
  - provider
  - model
  - input_tokens
  - output_tokens
  - fallback_provider
  - anonymized
  - at
properties:
  role:
    type: string
    pattern: '^[a-z][a-z0-9_]{0,31}$'
    maxLength: 32
    x-veridicus-limit: model_call_role_max_chars
  provider:
    enum: [anthropic, google, openai, local]
  model:
    $ref: '#/$defs/token'
  version:
    $ref: '#/$defs/token'
  effort_or_quantization:
    $ref: '#/$defs/token'
  engine:
    $ref: '#/$defs/token'
  seed:
    type: integer
    minimum: -9007199254740991
    maximum: 9007199254740991
  input_tokens:
    $ref: '#/$defs/count'
  output_tokens:
    $ref: '#/$defs/count'
  fallback_provider:
    type: boolean
    description: true cuando la llamada fue al proveedor alterno del perfil (FR15.2)
  anonymized:
    type: boolean
    description: false con un destino local; false con un destino externo es un incidente
  at:
    type: string
    format: date-time
$defs:
  token:
    type: string
    pattern: '^[A-Za-z0-9._:/@+-]{1,128}$'
    maxLength: 128
    x-veridicus-limit: report_token_max_chars
    description: Sin espacios; nombres de modelo, versiones, esfuerzos y motores
  count:
    type: integer
    minimum: 0
    maximum: 9007199254740991
