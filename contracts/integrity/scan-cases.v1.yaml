# Casos de escaneo (BR5.8, PD-6, FD-U1-09, D-2). U1 valida solo su forma (checks/scan_cases.py);
# el escáner scan(text, literal_sources) de U11 los ejecuta todos y su suite falla si una coincidencia
# o un tramo excluido difiere de lo esperado. Todo el texto es sintético: ningún fragmento de entrevista.
#
# rule: vocabulary    -> expect.matches (términos de C8 que coinciden) y expect.excluded (tramos «…» excluidos)
# rule: clarification -> expect.valid, expect.reasons y expect.phrases (regla de las aclaraciones neutras)
schema_version: 1.0.0
cases:
  # --- Escenarios de functional-spec: E10 a E14 y E30, y la decisión D-2 ---
  - id: e10-miente-en-observaciones
    source: E10
    synthetic: true
    rule: vocabulary
    field: observaciones
    text: "El compareciente miente sobre la hora de salida."
    literal_sources: []
    expect: {matches: [miente], excluded: []}
  - id: e11-cita-literal-con-falso
    source: E11
    synthetic: true
    rule: vocabulary
    field: observaciones
    text: "El compareciente dijo «que ese dato era falso» al hablar del puente."
    literal_sources:
      - "Yo le dije que ese dato era falso porque nadie lo confirmó."
    expect: {matches: [], excluded: ["que ese dato era falso"]}
  - id: e12-cita-que-no-esta-en-ningun-turno
    source: E12
    synthetic: true
    rule: vocabulary
    field: observaciones
    text: "Se registra «el relator miente» en la parte final."
    literal_sources:
      - "Hablamos del río y de la tienda."
    expect: {matches: [miente], excluded: []}
  - id: e13-mayusculas
    source: E13
