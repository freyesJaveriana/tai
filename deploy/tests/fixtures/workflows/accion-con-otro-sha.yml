---
# Control negativo: una acción permitida, pero con un SHA distinto del que usa el repositorio.
name: accion-con-otro-sha
on:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@0123456789abcdef0123456789abcdef01234567
