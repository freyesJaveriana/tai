[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veridicus-anonymizer"
version = "0.1.0"
description = "Anonimizador de Veridicus (C20): seudonimiza, llama una vez al proveedor y restaura, o falla cerrado."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "google-re2>=1.1",
    "jsonschema>=4.23",
    "veridicus-contracts",
    "veridicus-errors",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-socket>=0.7",
    "hypothesis>=6.120",
    "mypy>=1.13",
    "ruff>=0.8",
    "import-linter>=2.1",
    "pip-audit>=2.7",
    "hatchling>=1.26",
    "types-jsonschema>=4.23",
]

# veridicus-contracts y veridicus-errors se toman por ruta: el Bolt usa la versión del mismo árbol.
[tool.uv.sources]
veridicus-contracts = { path = "../../contracts" }
veridicus-errors = { path = "../errors" }

[tool.hatch.build.targets.wheel]
packages = ["src/veridicus_anonymizer"]

[tool.mypy]
strict = true
python_version = "3.12"
# veridicus_contracts instalado trae model_calls.py junto al directorio de datos model_calls/,
# y mypy elige el directorio y pierde los tipos; la fuente del mismo árbol va primero.
mypy_path = "src:../../contracts/src"
explicit_package_bases = true

# Al tomar la fuente de contracts, mypy también revisa validators.py, que importa una
# dependencia de desarrollo de contracts que este paquete no instala.
[[tool.mypy.overrides]]
module = ["openapi_spec_validator", "openapi_spec_validator.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Reglas por defecto más S (bandit). Toda supresión "# noqa: S..." lleva su motivo.
extend-select = ["S"]

[tool.ruff.lint.per-file-ignores]
# assert es el idioma de pytest.
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Sin --cov (R-01): cada paso pide la cobertura de sus propios módulos.
addopts = "--strict-markers --disable-socket"

[tool.coverage.run]
branch = true
source = ["veridicus_anonymizer"]

[tool.importlinter]
root_package = "veridicus_anonymizer"
include_external_packages = true

# C20: el módulo no conoce a quien lo usa (BR5.1, FD-U10-03).
[[tool.importlinter.contracts]]
name = "anonymizer-independent"
type = "forbidden"
source_modules = ["veridicus_anonymizer"]
forbidden_modules = [
    "model_gateway",
    "execution_profiles",
    "incoherence_analyzer",
    "veridicus_model_gateway",
    "veridicus_execution_profiles",
    "veridicus_incoherence_analyzer",
]

[[tool.importlinter.contracts]]
name = "anonymizer-layers"
type = "independence"
modules = [
    "veridicus_anonymizer.providers",
    "veridicus_anonymizer.domain",
]

# Nada de src/ fuera de testing/ importa testing. Un origen que contiene al prohibido se omite, así
# que son dos contratos: todo módulo o subpaquete de primer nivel (`veridicus_anonymizer.*`, con
# `testing` omitido por solaparse con lo prohibido) y el módulo raíz solo, sin sus descendientes.
[[tool.importlinter.contracts]]
name = "anonymizer-testing-not-in-production"
type = "forbidden"
source_modules = ["veridicus_anonymizer.*"]
forbidden_modules = ["veridicus_anonymizer.testing"]

[[tool.importlinter.contracts]]
name = "anonymizer-root-not-importing-testing"
type = "forbidden"
source_modules = ["veridicus_anonymizer"]
# Sin `as_packages`, importar un submódulo no cuenta como importar el paquete: se listan ambos.
forbidden_modules = ["veridicus_anonymizer.testing", "veridicus_anonymizer.testing.*"]
as_packages = false
