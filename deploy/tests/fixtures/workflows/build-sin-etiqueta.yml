---
# Control negativo (P5): docker build --tag de una variable cuya definición no lleva etiqueta.
name: build-sin-etiqueta
on:
  pull_request:
permissions:
  contents: read
env:
  IMAGE: ghcr.io/o/i
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Construir
        run: docker build --tag "$IMAGE" -f Dockerfile .
