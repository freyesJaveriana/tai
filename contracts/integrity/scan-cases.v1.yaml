    expect: {matches: [falso], excluded: []}
  - id: e30-aclaracion-con-frase-y-turno
    source: E30
    synthetic: true
    rule: clarification
    field: tema
    text: "Lo que antes dijo en T3"
    literal_sources: []
    expect: {valid: false, reasons: [phrase, cites_turn], phrases: [antes dijo]}
