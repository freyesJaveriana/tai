---
# El visor de la demo como un pod de Minikube con NodePort (solo para la demo, sin contraseña).
# Lo aplica el humano con scripts/humano/visor-pod.sh (AUTONOMIA-01); aquí solo se declara.
# Sin «namespace:» global: el Role y su RoleBinding viven en veridicus-demo y el resto en veridicus-visor.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml

# Los ejemplos del menú viajan como ConfigMap, no dentro de la imagen: un PR que cambia ejemplos.json,
# al fusionarse en main, lo aplica Argo CD y el pod nuevo los muestra (el sufijo del nombre cambia con
# el contenido, y con él la plantilla del Deployment). Es la demo del bucle GitOps.
configMapGenerator:
  - name: veridicus-visor-ejemplos
    namespace: veridicus-visor
    files:
      - ejemplos.json
  # El color de la barra superior: lo cambia scripts/humano/gitops-color.sh por PR, para mostrar el
  # bucle GitOps con un cambio visible y sin importancia (y su reversión con git revert).
  - name: veridicus-visor-apariencia
    namespace: veridicus-visor
    envs:
      - apariencia.properties
