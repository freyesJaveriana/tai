---
# Control negativo (M13): un trap ERR que sale con 0; el script termina antes del tar y el paso queda en verde
# sin la herramienta.
name: trap-err
on:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Instalar con un trap ERR
        env:
          SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
        run: |
          set -euo pipefail
          trap 'exit 0' ERR
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/a.tar.gz" "https://example.org/a.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/a.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/a.tar.gz" -C "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
