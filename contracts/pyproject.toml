[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veridicus-contracts"
version = "0.1.0"
description = "Contratos de Veridicus: esquemas, catálogos, tipos y comprobaciones transversales."
requires-python = ">=3.12"
dependencies = [
    "jsonschema[format]>=4.23",
    "referencing>=0.35",
    "ruamel.yaml>=0.18",
    "rfc8785>=0.1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-socket>=0.7",
    "hypothesis>=6.120",
    "openapi-spec-validator>=0.7",
    "mypy>=1.13",
    "ruff>=0.8",
    "pip-audit>=2.7",
    "hatchling>=1.26",
    "yamllint>=1.35",
]

# Mapa de rutas de functional-spec §1 (D1, D15). La rueda parte del árbol real de
# contracts/ con include + sources (hatchling aplica exclude, a diferencia de
# force-include): `uv build` y `uv build --wheel` dan la misma rueda y los
# fixtures no se empaquetan. dev-mode-dirs fuerza la instalación editable simple,
# porque con un `sources` que cambia de prefijo hatchling no admite otra; en
# desarrollo, src/veridicus_contracts/__init__.py expone python/ y los datos.
# Un directorio de datos nuevo se añade a include, a sources y a la prueba de
# inventario (tests/test_package_map.py).
[tool.hatch.build.targets.wheel]
include = [
    "/src/veridicus_contracts",
    "/python",
    "/analyzer",
    "/api",
    "/cli",
    "/errors",
    "/format",
    "/health",
    "/integrity",
    "/metrics",
    "/model_calls",
    "/profiles",
    "/queues",
    "/transcript",
    "/ui",
]
exclude = ["fixtures"]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
"python" = "veridicus_contracts"
"analyzer" = "veridicus_contracts/analyzer"
"api" = "veridicus_contracts/api"
"cli" = "veridicus_contracts/cli"
"errors" = "veridicus_contracts/errors"
"format" = "veridicus_contracts/format"
"health" = "veridicus_contracts/health"
"integrity" = "veridicus_contracts/integrity"
"metrics" = "veridicus_contracts/metrics"
"model_calls" = "veridicus_contracts/model_calls"
"profiles" = "veridicus_contracts/profiles"
"queues" = "veridicus_contracts/queues"
"transcript" = "veridicus_contracts/transcript"
"ui" = "veridicus_contracts/ui"

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["vendor", "ts"]

[tool.ruff.lint]
# Reglas por defecto más S (bandit). Toda supresión "# noqa: S..." lleva su motivo.
extend-select = ["S"]

[tool.ruff.lint.per-file-ignores]
# assert es el idioma de pytest.
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --cov=veridicus_contracts --cov-branch --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["veridicus_contracts"]

[tool.coverage.report]
# Única exclusión declarada: el código generado de la mitad TypeScript.
omit = ["ts/generated/*"]
