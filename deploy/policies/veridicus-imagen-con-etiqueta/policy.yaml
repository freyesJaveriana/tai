---
# Regla (b): toda imagen lleva una etiqueta o un digest, y ninguna es latest, ni con digest.
# Las dos expresiones son las de IMAGE_PINNED e IMAGE_LATEST de deploy/tests/policy_checks.py, y
# una prueba exige que el texto sea idéntico en los dos lados. La primera exige la etiqueta en el
# último segmento de la ruta, así que el puerto de un registro (registry:5000/img) no cuenta.
# Cubre containers, initContainers y ephemeralContainers. Un patrón con comodines (*?:?*) no sirve
# aquí: acepta registry:5000/img y !*:latest deja pasar x:latest@sha256:….
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: veridicus-imagen-con-etiqueta
  annotations:
    pod-policies.kyverno.io/autogen-controllers: none
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: imagen-con-etiqueta
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - veridicus-demo
      validate:
        message: Toda imagen lleva una etiqueta o un digest.
        foreach:
          - list: "request.object.spec.[containers, initContainers, ephemeralContainers][]"
            deny:
              conditions:
                all:
                  - key: "{{ regex_match('^([^@]*/)?[^/@:]+:[^/@:]+(@sha256:[0-9a-f]+)?$|^[^@]+@sha256:[0-9a-f]+$', '{{ element.image }}') }}"
                    operator: Equals
                    value: false
    - name: imagen-sin-latest
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - veridicus-demo
      validate:
        message: Ninguna imagen puede ser latest, tampoco con un digest.
        foreach:
          - list: "request.object.spec.[containers, initContainers, ephemeralContainers][]"
            deny:
              conditions:
                all:
                  - key: "{{ regex_match(':latest(@|$)', '{{ element.image }}') }}"
                    operator: Equals
                    value: true
