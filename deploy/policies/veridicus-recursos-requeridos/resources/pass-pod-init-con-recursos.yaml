---
apiVersion: v1
kind: Pod
metadata:
  name: init-con-recursos
  namespace: veridicus-demo
spec:
  initContainers:
    - name: preparar
      image: ghcr.io/o/a:v1
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
  containers:
    - name: analyzer
      image: ghcr.io/o/a:v1
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 512Mi
