[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veridicus-errors"
version = "0.1.0"
description = "Jerarquía única de excepciones de Veridicus: una clase sin lógica por code del catálogo."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "mypy>=1.13",
    "ruff>=0.8",
    "hatchling>=1.26",
]

[tool.hatch.build.targets.wheel]
packages = ["src/veridicus_errors"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Reglas por defecto más S (bandit). Toda supresión "# noqa: S..." lleva su motivo.
extend-select = ["S"]

[tool.ruff.lint.per-file-ignores]
# assert es el idioma de pytest.
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=veridicus_errors --cov-branch --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["veridicus_errors"]
