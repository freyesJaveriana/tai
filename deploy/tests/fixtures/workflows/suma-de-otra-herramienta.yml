---
# Control negativo: el paso baja trivy, pero su variable lleva la suma de la tabla de OTRA herramienta
# (kustomize): es una suma de la tabla, y no es la de este asset.
name: suma-de-otra-herramienta
on:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Instalar con la suma de otra herramienta
        env:
          SHA256: cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/a.tar.gz" "https://example.org/trivy_0.76.2_Linux-64bit.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/a.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/a.tar.gz" -C "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
