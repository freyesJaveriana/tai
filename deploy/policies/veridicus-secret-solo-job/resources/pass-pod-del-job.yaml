kind: Pod
metadata:
  name: veridicus-analyzer-demo-abcde
  namespace: veridicus-demo
  ownerReferences:
    - apiVersion: batch/v1
      kind: Job
      name: veridicus-analyzer-demo
      uid: 00000000-0000-0000-0000-000000000001
spec:
  containers:
    - name: analyzer
      image: ghcr.io/freyesjaveriana/veridicus-analyzer-cli:sha-abc1234
      env:
        - name: VERIDICUS_ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: veridicus-anthropic
              key: api-key
