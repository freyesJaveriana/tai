# C8: vocabulario prohibido (AUTONOMIA-03, BR5.1–BR5.5). Lo lee el escáner de U11 y lo valida
# checks/veracity.py. Cada ampliación de la lista entra por su propio PR con su control negativo.
# La lista es plana: ninguna fuente asigna una categoría a cada término.
# 2.1.0 (K-89, K-91): `match.fold` declara el plegado del texto; el escáner de U11 y la consola de U8
# lo leen de aquí en lugar de tenerlo escrito en su código.
schema_version: 2.1.0
match:
  whole_word: true
  case_insensitive: true
  accent_insensitive: true
  # Tramos que el escáner no recorre (BR5.3, BR5.5): la cita literal, el texto del analista y el aviso.
  excluded_spans: [cita_literal, analyst_text, notice_text]
  # Cita literal dentro de hecho, observaciones y tema (FD-U1-09): el texto entre «…» que aparece
  # carácter a carácter (salvo espacios) en un turno de la entrada.
  quote_delimiters: ["«", "»"]
  quote_fields: [hecho, observaciones, tema]
  # D-2: un tramo «…» que es solo un término prohibido sí se escanea (FD-U1-14, FD-U11-20).
  scan_bare_term_spans: true
  # Textos que se excluyen enteros del escaneo (BR5.5).
  excluded_whole_texts:
    # 2.0.1 (K-86): el campo de texto de la cita en C6 se llama `cita`, no `texto`.
    - salida.hallazgos[].cita_a.cita
    - salida.hallazgos[].cita_b.cita
    - sugerencia.note
    - sugerencia.reformulation
    - aviso.text
  # Plegado del texto antes de buscar, por carácter y en este orden: descomposición de compatibilidad,
  # descarte y plegado de mayúsculas. Se descarta todo carácter con clase combinante distinta de 0, de
  # las categorías `dropped_categories` o dentro de `dropped_code_points`.
  fold:
    normalization: NFKD
    # Alcance de la descomposición de compatibilidad (F-01 de la ronda 1): NFKD solo a los caracteres
    # que son letra o dígito (`\w`: ancho completo, letras matemáticas, ligaduras); el resto (™, №, ⓐ,
    # ㎡…) sigue con NFD y conserva su papel de separador. Así el plegado solo amplía la detección.
    compatibility_scope: word_characters
    case: casefold
    dropped_categories: [Mn, Me, Cf]
    # Default_Ignorable_Code_Point (Unicode 15.0/16.0, DerivedCoreProperties.txt), en rangos cerrados.
    # Incluye los 4 rellenos Hangul (`Lo`) y los 3769 `Cn` sin asignar del grupo (K-91).
    dropped_code_points:
      - [0x00AD, 0x00AD]
      - [0x034F, 0x034F]
      - [0x061C, 0x061C]
      - [0x115F, 0x1160]
      - [0x17B4, 0x17B5]
      - [0x180B, 0x180F]
      - [0x200B, 0x200F]
      - [0x202A, 0x202E]
      - [0x2060, 0x206F]
      - [0x3164, 0x3164]
      - [0xFE00, 0xFE0F]
      - [0xFEFF, 0xFEFF]
      - [0xFFA0, 0xFFA0]
      - [0xFFF0, 0xFFF8]
      - [0x1BCA0, 0x1BCA3]
      - [0x1D173, 0x1D17A]
      - [0xE0000, 0xE0FFF]
terms:
  - mentiroso
  - mentirosa
  - miente
  - mintió
  - falso
  - falsa
  - verdadero
  - verdadera
  - engaño
  # E-7 (2026-11-23): términos de VE-02 (adenda 02) con sus flexiones regulares de género y número.
  # Ninguna fuente fija más variantes de género y número.
  # E-8 (2026-11-23): formas verbales comunes de «mentir», «inculpar» y «engañar»: presente, pretérito
  # (perfecto e imperfecto) e infinitivo. Del imperfecto solo «mentía» y «mentían». «miente», «mintió»,
  # «inculpa» y «engaño» ya estaban. Quedan fuera las formas de «probar» («pruebe», «probó», «probar»):
  # falsos positivos en los textos de la interfaz.
  - prueba
  - pruebas
  - probatorio
  - probatoria
  - probatorios
  - probatorias
  - pliego
  - pliegos
  - inculpa
  - engaños
  - falsos
  - falsas
  - miento
  - mientes
  - mienten
  - mentimos
  - mentís
  - mentí
  - mentiste
  - mentisteis
  - mintieron
  - mentir
  - mentía
  - mentían
  - inculpas
  - inculpamos
  - inculpáis
  - inculpan
  - inculpé
  - inculpaste
  - inculpasteis
  - inculpó
  - inculparon
  - inculpar
  - engañas
  - engaña
  - engañamos
  - engañáis
  - engañan
  - engañé
  - engañaste
  - engañasteis
  - engañó
  - engañaron
  - engañar
categories_forbidden_in_schemas: [veracity_score, is_lying, truthfulness, veracidad, credibilidad]
scanned:
  - salida.hallazgos[].hecho
  - salida.hallazgos[].observaciones
  - salida.observaciones_conductor[].tema
  - reporte consolidado
  - catálogo de mensajes de la consola
