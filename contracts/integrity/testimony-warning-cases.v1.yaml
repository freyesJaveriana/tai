# Casos compartidos del aviso de testimonio en el reporte de un problema (BR3.6 y BR3.7 de U13; NFR-U13-10,
# NFRD-U13-13). El servidor (Python) y la consola (TypeScript) corren estos mismos ejemplos.
# Regla: se parte la nota y cada turno en palabras con la lista de espacios de abajo, y hay aviso si alguna
# secuencia de testimony_warning_words (C25) o más palabras idénticas y seguidas está en un turno.
# whitespace_code_points es la lista de str.isspace() de Python; U+FEFF no es espacio y no separa palabras.
# Todo el texto es sintético.
schema_version: 1.0.0
synthetic: true
testimony_warning_words: 8
whitespace_code_points:
  - U+0009
  - U+000A
  - U+000B
  - U+000C
  - U+000D
  - U+001C
  - U+001D
  - U+001E
  - U+001F
  - U+0020
  - U+0085
  - U+00A0
  - U+1680
  - U+2000
  - U+2001
  - U+2002
  - U+2003
  - U+2004
  - U+2005
  - U+2006
  - U+2007
  - U+2008
  - U+2009
  - U+200A
  - U+2028
  - U+2029
  - U+202F
  - U+205F
  - U+3000
cases:
  - id: ocho-palabras
    note: "Vi que la luna subió despacio sobre el techo viejo anoche"
    turns: ["Ayer la luna subió despacio sobre el techo viejo del almacén"]
    testimony_warning: true
  - id: siete-palabras
    note: "la luna subió despacio sobre el techo"
    turns: ["Ayer la luna subió despacio sobre el techo viejo del almacén"]
    testimony_warning: false
  - id: dos-turnos
    note: "la luna subió despacio sobre el techo viejo"
    turns: ["la luna subió despacio", "sobre el techo viejo"]
    testimony_warning: false
  - id: espacios-distintos
    note: "la  luna subió   despacio sobre  el techo viejo"
    turns: ["Ayer la luna subió despacio sobre el techo viejo del almacén"]
    testimony_warning: true
  - id: u00a0
    note: "la luna subió despacio sobre el techo viejo"
    turns: ["Ayer la luna subió despacio sobre el techo viejo del almacén"]
    testimony_warning: true
  - id: u3000
    note: "la　luna　subió　despacio　sobre　el　techo　viejo"
    turns: ["Ayer la luna subió despacio sobre el techo viejo del almacén"]
    testimony_warning: true
  - id: ufeff
    note: "la﻿luna﻿subió﻿despacio﻿sobre﻿el﻿techo﻿viejo"
    turns: ["Ayer la luna subió despacio sobre el techo viejo del almacén"]
    testimony_warning: false
  - id: tabulador
    note: "la\tluna\tsubió\tdespacio\tsobre\tel\ttecho\tviejo"
    turns: ["Ayer la luna subió despacio sobre el techo viejo del almacén"]
    testimony_warning: true
  - id: salto-de-linea
    note: "la\nluna\nsubió\ndespacio\nsobre\nel\ntecho\nviejo"
    turns: ["Ayer la luna subió despacio sobre el techo viejo del almacén"]
    testimony_warning: true
