# Catálogo único de errores v2 (NFR10.3, BR7.2, BR7.4, D16).
# Por code: un solo status HTTP, la clase de excepción de libs/errors/, la unidad dueña y
# http. Los de arranque y de log llevan http: false y ningún status. limits.exceeded es
# siempre 413. c6 enlaza cada error.codigo de C6 con su code (BR3.4, E34).
