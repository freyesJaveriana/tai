[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veridicus-prueba-zine"
version = "0.1.0"
description = "Paquete mínimo de la validación US14.1 (M5): comprueba la instalación sin internet en un SL250s"
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "httpx", "jsonschema", "pyyaml"]

[project.scripts]
veridicus-prueba-zine = "veridicus_prueba_zine:main"
