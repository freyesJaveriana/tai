[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veridicus-demo"
version = "0.1.0"
description = "Punto de entrada de la demo de B4-demo: corre la CLI del analizador sobre una entrada sintética y muestra sus hallazgos."
requires-python = ">=3.12,<3.13"
dependencies = [
    "veridicus-incoherence-analyzer[cli]",
    "veridicus-integrity-policy",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-socket>=0.7",
    "mypy>=1.13",
    "ruff>=0.8",
    "types-jsonschema>=4.23",
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
]

# Todas las rutas son de este mismo árbol. El analizador declara editables a sus cuatro hermanos y
# uv rechaza dos URL distintas para el mismo paquete, así que aquí llevan la misma marca; la imagen
# los instala como copias con `uv sync --no-editable`, que anula la marca (la comprueba test_dockerfile).
[tool.uv.sources]
veridicus-incoherence-analyzer = { path = "../libs/incoherence_analyzer" }
veridicus-contracts = { path = "../contracts" }
veridicus-errors = { path = "../libs/errors" }
veridicus-execution-profiles = { path = "../libs/execution_profiles", editable = true }
veridicus-integrity-policy = { path = "../libs/integrity_policy", editable = true }
veridicus-model-gateway = { path = "../libs/model_gateway", editable = true }
veridicus-anonymizer = { path = "../libs/anonymizer", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/veridicus_demo"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src:tests"
explicit_package_bases = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Reglas por defecto más S (bandit). Toda supresión "# noqa: S..." lleva su motivo.
extend-select = ["S"]

[tool.ruff.lint.per-file-ignores]
# assert es el idioma de pytest.
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `src` primero: la prueba corre el código del árbol y no la copia que uv instaló sin modo editable.
pythonpath = ["src", "tests"]
addopts = "--strict-markers --disable-socket"

[tool.coverage.run]
branch = true
source = ["veridicus_demo"]
